<dialog class="gallery-dialog" aria-label="Просмотр фотографии">
	<div class="gallery-view-controls" hidden>
		<button class="gym-slider-arrow" type="button" data-gallery-prev aria-label="Предыдущее фото"><svg aria-hidden="true"><use href="#arrow"/></svg></button>
		<span data-gallery-counter aria-live="polite"></span>
		<button class="gym-slider-arrow" type="button" data-gallery-next aria-label="Следующее фото"><svg aria-hidden="true"><use href="#arrow"/></svg></button>
	</div>
	<button class="icon-link" data-close-gallery aria-label="Закрыть фотографию"><svg><use href="#close"/></svg></button>
	<figure>
		<img src="/zubr/images/gym-3.webp" width="960" height="1280" alt="">
		<figcaption></figcaption>
	</figure>
</dialog>
