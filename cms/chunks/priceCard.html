<article class="training-price">
	<div class="training-price__brand">
		<img src="/zubr/images/zubr-wordmark.png" width="416" height="64" alt="ZUBR GYM">
		<span>[[+badge:htmlent]]</span>
	</div>
	<div class="training-price__heading">
		<h3>[[+title:htmlent]]</h3>
		<span>[[+age:htmlent]]</span>
	</div>
	<p class="training-price__amount"><strong>[[+amount:htmlent]]</strong><span>[[+currency:htmlent]]</span></p>
	<p class="training-price__quantity">[[+quantity:htmlent]]</p>
</article>
