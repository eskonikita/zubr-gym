<div class="container coaches-intro blog-intro">
	[[$breadcrumbs]]
	<div class="article-meta">
		<div class="article-meta__badge article-category-badge" aria-label="Категория: [[*article_category:htmlent]]">
			<svg aria-hidden="true"><use href="#category"/></svg>
			<span>[[*article_category:htmlent]]</span>
		</div>
		<div class="article-meta__badge article-date-badge" aria-label="Опубликовано: [[*publishedon:default=`[[*createdon]]`:date=`%d.%m.%Y`]]">
			<svg aria-hidden="true"><use href="#calendar"/></svg>
			<time datetime="[[*publishedon:default=`[[*createdon]]`:date=`%Y-%m-%d`]]">[[*publishedon:default=`[[*createdon]]`:date=`%d.%m.%Y`]]</time>
		</div>
	</div>
	<h1>[[*page_heading]]</h1>
	<p>[[*page_intro]]</p>
</div>
