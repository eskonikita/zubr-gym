<section class="section coach-publication" aria-labelledby="publication-title">
	<div class="container">
		<div class="coach-publication__row">
			<span class="coach-publication__date">[[+publication_date:htmlent]]</span>
			<div>
				<h2 id="publication-title">[[+publication_heading]]</h2>
				<p>[[+publication_description:htmlent]]</p>
				<a href="[[+publication_url:htmlent]]" target="_blank" rel="noopener noreferrer">[[+publication_label:htmlent]]<svg aria-hidden="true"><use href="#arrow"/></svg></a>
			</div>
		</div>
	</div>
</section>
