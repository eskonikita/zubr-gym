<section class="section hall-location" aria-labelledby="location-title">
	<div class="container">
		<div class="hall-location__inner">
			<div>
				<h2 id="location-title">[[+heading]]</h2>
				<p>[[+description:htmlent]]</p>
			</div>
			<div class="hall-location__actions">
				<a class="button hall-route" href="[[++zubr_contact_map_url:htmlent]]" target="_blank" rel="noopener noreferrer"><svg aria-hidden="true"><use href="#pin"/></svg>[[+route_label:htmlent]]</a>
				<a class="button button-primary" href="tel:[[++zubr_contact_phone:ZubrPhone]]" aria-label="Позвонить в ZUBR GYM: [[++zubr_contact_phone:htmlent]]"><svg aria-hidden="true"><use href="#phone"/></svg>[[++zubr_contact_phone:htmlent]]</a>
			</div>
		</div>
	</div>
</section>
