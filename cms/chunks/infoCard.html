<a class="hall-link info-card [[+wide:is=`1`:then=`info-card--wide`:else=``]]" href="[[~[[+property.resource_id]]? &scheme=`abs`]]">
	<img class="info-card__icon" src="[[+icon:default=`/zubr/images/info/default.svg`:htmlent]]" alt="" width="160" height="180" loading="lazy" decoding="async">
	<div>
		<h2>[[+title:default=`[[+property.resource_title]]`:htmlent]]</h2>
		<span>[[+description:default=`[[+property.resource_description]]`:stripTags:htmlent]]</span>
	</div>
	<svg class="hall-link__arrow" aria-hidden="true"><use href="#arrow"/></svg>
</a>
