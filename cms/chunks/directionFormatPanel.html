<div class="group-panel" id="panel-format-[[+MIGX_id]]" role="tabpanel" aria-labelledby="tab-format-[[+MIGX_id]]" aria-hidden="[[+idx:is=`1`:then=`false`:else=`true`]]" tabindex="0" [[+idx:is=`1`:then=``:else=`hidden inert`]]>
	<div class="group-panel__copy">
		<h3>[[+heading:htmlent]]</h3>
		<p>[[+description:htmlent]]</p>
		<ul class="group-benefits">
			<li>[[+benefits:htmlent:nl2br:replace=`<br />==</li><li>`]]</li>
		</ul>
		<a class="button button-primary" href="tel:[[++zubr_contact_phone:ZubrPhone]]">[[+button_label:htmlent]]<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
	</div>
	<div class="group-panel__art" data-program-art="format-[[+MIGX_id]]" aria-hidden="true">
		<img class="group-panel__image" src="[[+image:htmlent]]" width="800" height="1200" alt="" loading="lazy" decoding="async">
	</div>
</div>
