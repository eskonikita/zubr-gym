<div class="cookie-preferences" data-cookie-form>
	<label class="cookie-option">
		<span><strong>Необходимые</strong><span>Работа сайта и сохранение вашего выбора. Всегда включены.</span></span>
		<input class="cookie-switch" type="checkbox" role="switch" aria-label="Необходимые cookie — всегда включены" checked disabled>
	</label>
	<label class="cookie-option">
		<span><strong>Карта Яндекса</strong><span>Разрешить загрузку карты на странице контактов. Яндекс может получать технические данные и использовать свои cookie.</span></span>
		<input class="cookie-switch" type="checkbox" role="switch" aria-label="Разрешить карту Яндекса" data-cookie-functional>
	</label>
	<label class="cookie-option">
		<span><strong>Аналитика</strong><span>Статистика посещений и использования страниц помогает улучшать сайт. Сейчас счётчики не подключены; выбор сохраняется отдельно.</span></span>
		<input class="cookie-switch" type="checkbox" role="switch" aria-label="Разрешить аналитические cookie" data-cookie-analytics>
	</label>
	<p class="cookie-note">Необязательные категории можно отключить без потери доступа к основным материалам. Рекламные пиксели не подключены.</p>
	<div class="cookie-buttons">
		<button class="cookie-button" type="button" data-cookie-save>Сохранить настройки</button>
		<button class="cookie-button cookie-button--outline" type="button" data-cookie-reject>Только необходимые</button>
	</div>
	<p class="cookie-status" role="status" aria-live="polite" data-cookie-status></p>
</div>
