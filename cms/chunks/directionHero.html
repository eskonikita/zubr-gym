<div class="container discipline-top">
	[[$breadcrumbs]]
	<section class="discipline-hero" aria-labelledby="discipline-title">
		<div class="discipline-hero__copy">
			<h1 id="discipline-title">[[*page_heading]]</h1>
			<p>[[*page_intro]]</p>
			<div class="discipline-hero__actions">
				<a class="button button-primary" href="tel:[[++zubr_contact_phone:ZubrPhone]]">[[+hero_call_label:htmlent]]<svg aria-hidden="true"><use href="#phone"/></svg></a>
				<a class="button discipline-hero__prices" href="[[~31? &scheme=`abs`]]">[[+hero_prices_label:htmlent]]<svg aria-hidden="true"><use href="#arrow"/></svg></a>
			</div>
		</div>
		<img class="discipline-hero__art" src="[[+hero_image:htmlent]]" width="800" height="1200" alt="" fetchpriority="high">
	</section>
</div>
